name: Deploy site

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'src/webview/**'
      # App.svelte e stores.svelte.ts saem de src/webview/ para consumir
      # src/types.ts (formas de SessionSnapshot/Todo/etc.) e src/i18n/ (t.ts,
      # messages.ts, locale.ts — as traducoes do painel nos 5 idiomas). Sem
      # isso, mudar uma traducao nao redeploya o site, que fica exibindo
      # texto velho indefinidamente.
      - 'src/i18n/**'
      - 'src/types.ts'
      - 'README*.md'
      # LandingLayout.astro importa media/icon.svg?raw (a marca inline no
      # topbar) — sem este path, trocar o icone nao redeploya o site. Mesmo
      # defeito que o comentario acima ja descreve ter corrigido para
      # src/i18n/**, faltando esta entrada.
      - 'media/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# O deploy do Pages precisa escrever no ambiente github-pages; nada alem disso.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; nao cancela um em andamento para nao publicar pela metade.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Duas arvores de dependencia: a raiz fornece os componentes do webview,
      # site/ fornece o Astro.
      - run: npm ci
      - run: npm ci
        working-directory: site

      - run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
